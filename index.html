/* Estallido: Draft (estructura de Draft Showdown)
   - Mazo de 4 personajes. Cada ronda: 3 elecciones, y cada carta se ve al instante en el tablero.
   - Tres tipos de carta: "+N" suma gente, "UP" mejora a todos los de ese tipo, "×2" duplica cuántos tienes.
   - Los ejércitos se acumulan; filas limpias por tipo; la batalla sin textos encima. */

/* ================= sonido ================= */
const AU={on:false,last:{}};
function audioInit(){
  if(AU.on)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const a=new AC();AU.a=a;AU.on=true;
  const comp=a.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;comp.connect(a.destination);
  AU.out=a.createGain();AU.out.gain.value=.7;AU.out.connect(comp);
  const len=a.sampleRate*2,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.nb=buf;
  AU.step=0;AU.next=a.currentTime+.1;
  if(a.state==='suspended')a.resume();
}
function nz(t,dur,type,f0,f1,q,gain){const a=AU.a,s=a.createBufferSource();s.buffer=AU.nb;const f=a.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q||1;const g=a.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);s.connect(f);f.connect(g);g.connect(AU.out);s.start(t,Math.random()*1.5,dur+.05);}
function tn(t,dur,type,f0,f1,gain){const a=AU.a,o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=a.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(g);g.connect(AU.out);o.start(t);o.stop(t+dur+.03);}
const DR={kick:(t,g)=>tn(t,.22,'sine',150,42,g||.6),snare:t=>{nz(t,.12,'bandpass',1900,0,.8,.22);tn(t,.06,'triangle',230,170,.08);}};
const SFX={
  hit:t=>{nz(t,.07,'bandpass',900,0,1.2,.25);tn(t,.07,'sine',200,80,.18);},
  block:t=>{tn(t,.18,'triangle',1500,1400,.06);},
  boom:t=>{nz(t,.4,'lowpass',1500,140,.8,.55);tn(t,.32,'sine',120,38,.55);},
  whoosh:t=>{nz(t,.3,'bandpass',500,2200,.8,.15);},
  ko:t=>{nz(t,.22,'lowpass',1700,180,.8,.35);tn(t,.2,'sine',140,40,.35);},
  fall:t=>{tn(t,.16,'square',330,110,.04);},
  heal:t=>{tn(t,.2,'sine',660,1100,.06);},
  drum:t=>{DR.kick(t,.7);DR.kick(t+.12,.5);DR.snare(t+.24);},
  gas:t=>{nz(t,.6,'lowpass',900,200,.6,.28);},
  siren:t=>{tn(t,.25,'square',700,950,.045);tn(t+.25,.25,'square',950,700,.045);},
  build:t=>{for(let i=0;i<3;i++)nz(t+i*.09,.06,'bandpass',1200,0,2,.28);},
  join:t=>{[0,4,7].forEach((s,i)=>tn(t+i*.06,.18,'triangle',660*Math.pow(2,s/12),0,.1));},
  win:t=>{[0,4,7,12].forEach((s,i)=>tn(t+i*.09,.3,'triangle',523*Math.pow(2,s/12),0,.14));DR.kick(t,.8);},
  lose:t=>{[0,-3,-7].forEach((s,i)=>tn(t+i*.14,.35,'triangle',392*Math.pow(2,s/12),0,.12));},
  tap:t=>{tn(t,.05,'triangle',700,500,.07);},
  pop:t=>{tn(t,.08,'sine',520,900,.08);},
  card:t=>{nz(t,.12,'highpass',3000,0,.6,.15);tn(t,.12,'sine',440,880,.12);},
  up:t=>{[0,4,7,12].forEach((s,i)=>tn(t+i*.05,.15,'square',523*Math.pow(2,s/12),0,.05));},
  enemy:t=>{tn(t,.12,'square',330,250,.06);},
  fight:t=>{DR.kick(t,.9);nz(t,.3,'bandpass',800,2000,.7,.3);},
  lvl:t=>{[0,4,7,12,16].forEach((s,i)=>tn(t+i*.07,.25,'square',523*Math.pow(2,s/12),0,.05));},
  tut:t=>{tn(t,.12,'sine',880,880,.08);tn(t+.1,.15,'sine',1175,0,.08);}
};
function sfx(n){if(!AU.on)return;const t=AU.a.currentTime;if(AU.last[n]&&t-AU.last[n]<.05)return;AU.last[n]=t;SFX[n](t+.005);}
function audioTick(){
  if(!AU.on)return;const a=AU.a;
  if(scene!=='battle'||!M||M.tut){AU.next=a.currentTime+.1;return;}
  const spb=60/104/4/M.speed;
  while(AU.next<a.currentTime+.12){const s=AU.step%16,t=AU.next;if(s===0||s===8)DR.kick(t,.3);if(s===4||s===12)DR.snare(t);AU.step++;AU.next+=spb;}
}

const ARENAS=[[0,'Colonia Obrera'],[80,'Avenida'],[180,'Centro Histórico'],[300,'Zócalo']];

/* ================= progreso guardado ================= */
const SKEY='estallido_draft_v5';
function fresh(){return {v:5,tro:0,wins:0,games:0,lv:{},cards:{},seen:{},boss:{},mas:{},deck:['estudiante','chela','bloque','cohetero']};}
function load(){
  try{const o=JSON.parse(localStorage.getItem(SKEY));if(o&&o.v===5)return o;}catch(e){}
  /* si venías jugando la versión anterior, se respeta tu progreso y tus personajes con nivel ya traen Maestría 2 */
  try{const o=JSON.parse(localStorage.getItem('estallido_draft_v4'));if(o&&o.v===4){o.v=5;o.mas={};for(const id in o.lv)if(o.lv[id]>=2)o.mas[id]=MAS[1];o.deck=o.deck.filter(id=>CH[id]);return o;}}catch(e){}
  return fresh();
}
let SV=load();SV.boss=SV.boss||{};
function save(){try{localStorage.setItem(SKEY,JSON.stringify(SV));}catch(e){}}
const lvOf=id=>SV.lv[id]||1;
const need=l=>2+l*2;
const masPts=id=>(SV.mas&&SV.mas[id])||0;
const masLv=id=>{let l=0;while(l<MAS.length&&masPts(id)>=MAS[l])l++;return l;};
const masDmg=id=>1+.1*((masLv(id)>=3)+(masLv(id)>=6));
const masHp=id=>1+.1*((masLv(id)>=4)+(masLv(id)>=7));
const lvMult=id=>1+.1*(lvOf(id)-1);
const unlocked=id=>!CH[id].unlock||SV.tro>=CH[id].unlock;
const curTro=()=>{const R=SV.run;
  if(R&&(scene==='map'||scene==='opts'))return R.cols[Math.min(R.g,R.cols.length-1)][0].eq;
  if(typeof M!=='undefined'&&M&&M.node&&(scene==='draft'||scene==='battle'))return M.node.eq;
  return SV.tro;};
const arena=()=>{let a=ARENAS[0];const t=curTro();for(const q of ARENAS)if(t>=q[0])a=q;return a;};

/* ================= estado ================= */
let INFO=null,SWAP=null;
let scene='title',M=null,btns=[],ptr={x:0,y:0},T=0,confirmReset=0,ENDA=0,BAN=null;

/* ================= partida ================= */
const ARC=[80,180,300,450],BOSSN=['COMANDANTE','GRANADERO MAYOR','CAPITÁN MONTADO','EL COMISARIO'];
function arIdx(){let i=0;const t=curTro();for(let k=0;k<ARENAS.length;k++)if(t>=ARENAS[k][0])i=k;return i;}
function bossReady(){const i=arIdx();return !SV.boss[i]&&SV.tro>=ARC[i]-1;}
function startMatch(bi,node){
  clearDecals();delete SV.dmg;
  const extra=['gas','moto','tirador'];if(SV.tro>=60)extra.push('tanqueta');if(SV.tro>=30)extra.push('montada');
  for(let i=extra.length-1;i>0;i--){const j=ri(0,i);[extra[i],extra[j]]=[extra[j],extra[i]];}
  const R=node?SV.run:null;
  M={round:1,lives:node?[R.hearts,node.type==='fight'?2:3]:[LIVES,LIVES],maxL:node?R.maxH:LIVES,maxE:node?(node.type==='fight'?2:3):LIVES,run:!!node,node:node||null,army:{},parmy:{},pdeck:node?node.pdeck.slice():['cadete','anti',extra[0],extra[1]],speed:1,kos:0,lost:[false,false],used:{},boss:typeof bi==='number'?bi:null};
  if(node)for(const id in R.start){const q=R.start[id];M.army[id]={n:q.n,up:!!q.up};}
  if(node&&hasRel('termo'))for(const id of R.deck)if(CH[id]){const a=M.army[id]||(M.army[id]={n:0,up:false});a.n=Math.min(capOf(CH[id]),a.n+1);}
  if(M.boss!=null)M.parmy['jefe'+M.boss]={n:1,up:false};
  prepRound();
}
const defOf=(side,id)=>side?PO[id]:CH[id];
/* las tres clases de carta: sumar gente, mejorar a todos los de un tipo, duplicar */
function makeCard(side,id){
  const A=side?M.parmy:M.army,d=defOf(side,id),cur=A[id];
  const have=cur?cur.n:0,room=capOf(d)-have;
  const n=Math.min(room,d.add+(!side&&masLv(id)>=5?1:0)+(!side&&M.run&&hasRel('megafono')?1:0));
  const canX2=side||masLv(id)>=1,canUp=side||masLv(id)>=2;
  /* si ya está lleno, no se ofrece una carta que no haría nada */
  const opts=n>0?[{id,kind:'add',n},{id,kind:'add',n}]:[];
  if(canUp&&cur&&cur.n>0&&!cur.up&&M.round>=2)opts.push({id,kind:'up'});
  if(canX2&&cur&&cur.n>=1&&cur.n*2<=capOf(d)&&M.round>=2)opts.push({id,kind:'x2'});
  if(id==='tanqueta')return n>0?{id,kind:'add',n:1}:null;
  return opts.length?opts[ri(0,opts.length-1)]:null;
}
function rollCards(side){
  const dk=(side?M.pdeck:(M.run?SV.run.deck:SV.deck)).filter(id=>!(side&&id==='tanqueta'&&(M.round<3||(M.parmy.tanqueta&&M.parmy.tanqueta.n>=2))||side&&id==='montada'&&M.round<2));
  for(let i=dk.length-1;i>0;i--){const j=ri(0,i);[dk[i],dk[j]]=[dk[j],dk[i]];}
  return dk.map(id=>makeCard(side,id)).filter(Boolean).slice(0,3);
}
const x2gain=(d,n)=>Math.min(n,d.add*3);
/* cuánto vale un ejército, en "cartas +N": así se compara la marcha con la policía */
function armyVal(side){const A=side?M.parmy:M.army;let v=0;for(const id in A){const d=defOf(side,id),a=A[id];if(d&&a.n>0)v+=a.n/d.add*(a.up?1.6:1);}return v;}
function cardVal(side,c,A){const d=defOf(side,c.id),a=A[c.id]||{n:0,up:false};
  if(c.kind==='add')return c.n/d.add;if(c.kind==='up')return a.up?0:a.n/d.add*.6;return x2gain(d,a.n)/d.add;}
function applyCard(side,c){
  const A=side?M.parmy:M.army;
  const cur=A[c.id]||(A[c.id]={n:0,up:false});
  const d=defOf(side,c.id);
  if(c.kind==='add')cur.n=Math.min(capOf(d),cur.n+c.n);
  else if(c.kind==='up'){cur.up=true;M.upBan={txt:cardLabel(side,c),side,t:T};}
  else cur.n=Math.min(capOf(d),cur.n+x2gain(d,cur.n));
  if(!side)M.used[c.id]=(M.used[c.id]||0)+1;
  rebuild(side,c);
}
function cardLabel(side,c){const d=defOf(side,c.id);return c.kind==='add'?'+'+c.n+' '+(c.n>1?d.n:(d.uno||d.n)):c.kind==='up'?'¡'+(d.uno||d.n)+' UP!':d.n+' ×2';}
function prepRound(){
  M.pmult=(1.4+.12*(M.round-1))*(1+(M.node?M.node.eq:SV.tro)/180)*(M.node?RUNSC*(.5+.05*M.node.z)*(M.node.type==='elite'?1.3:1):1);
  /* la policía elige primero: sus cartas aparecen como letrero sobre su ejército */
  M.pq=[];
  /* la policía elige mirando a la marcha: si va muy por delante elige la carta más chica, si va atrás la más grande.
     Se calcula sobre una copia de su ejército para no duplicar dos veces lo mismo. */
  const PA=JSON.parse(JSON.stringify(M.parmy)),target=armyVal(0)+PICKS;
  let pv=armyVal(1);
  const sim=c=>{const a=PA[c.id]||(PA[c.id]={n:0,up:false}),d=PO[c.id];const g=cardVal(1,c,PA);
    if(c.kind==='add')a.n+=c.n;else if(c.kind==='up')a.up=true;else a.n+=x2gain(d,a.n);pv+=g;};
  for(let i=0;i<PICKS;i++){
    const save=M.parmy;M.parmy=PA;const cs=rollCards(1);M.parmy=save;
    cs.sort((a,b)=>cardVal(1,a,PA)-cardVal(1,b,PA));
    const c=pv>target*1.15?cs[0]:pv<target*.85?cs[cs.length-1]:cs[ri(0,cs.length-1)];
    sim(c);M.pq.push(c);}
  /* bono de remontada de la policía: solo si de verdad va atrás, y con el mismo tope */
  if(M.lost[1]&&pv<target*1.1){const ids=Object.keys(PA).filter(k=>PA[k].n>0&&k!=='tanqueta'&&!PO[k].boss);if(ids.length){const id=ids[ri(0,ids.length-1)],c=PA[id].up?{id,kind:'x2',bonus:true}:{id,kind:Math.random()<.5?'up':'x2',bonus:true};sim(c);M.pq.push(c);}}
  /* si perdiste la ronda, eliges un bono: tres cartas doradas de tus personajes en el campo */
  M.bonusOpts=null;M.bonusPick=false;
  if(M.lost[0]){
    const ids=Object.keys(M.army).filter(k=>M.army[k].n>0);
    for(let i=ids.length-1;i>0;i--){const j=ri(0,i);[ids[i],ids[j]]=[ids[j],ids[i]];}
    /* primero una carta por personaje distinto; si tienes pocos tipos, se completan con otras opciones */
    const first=[],rest=[];
    for(const id of ids){const a=M.army[id],d=CH[id],ok=[];
      if(!a.up)ok.push({id,kind:'up',bonus:true});if(a.n*2<=capOf(d))ok.push({id,kind:'x2',bonus:true});
      if(a.n<capOf(d))ok.push({id,kind:'add',n:Math.min(d.add*2,capOf(d)-a.n),bonus:true});
      if(!ok.length)continue;
      const j=ri(0,Math.max(0,ok.length-2));first.push(ok.splice(j,1)[0]);rest.push(...ok);}
    const cs=[...first,...rest].slice(0,3);
    if(cs.length)M.bonusOpts=cs;
  }
  M.pickN=0;M.opts=null;M.pqT=.6;M.enemyBan=null;M.enemyTurn=true;M.bonusJust=false;
  M.guide=SV.seen.guide?null:0;
  scene='draft';
  rebuild(0);rebuild(1);
}
function nextOpts(){M.opts=rollCards(0);if(!M.opts.length){M.opts=null;M.pickN=PICKS;M.nextT=.4;}}
function pickCard(i){
  if(!M.opts||M.pqT>0)return;
  const c=M.opts[i];if(!c)return;
  applyCard(0,c);if(M.bonusPick){M.bonusPick=false;M.bonusJust=true;}else M.pickN++;sfx(c.kind==='up'?'up':'card');
  M.opts=null;
  M.nextT=Math.max(.9,(M.spawnEnd0||T)-T+.45);   /* esperar a que lleguen todos y luego mostrar las siguientes */
  M.last=c;
}

/* ================= formación: filas limpias por tipo ================= */
function mk(side,id,up){
  const d=defOf(side,id)||{hp:1};
  const base=(side?M.pmult:lvMult(id))*(up?UPM*((!side&&M&&M.run&&hasRel('chamarra'))?1.2:1):1);
  const rd=(!side&&M&&M.run)?SV.run.dmg:1,rh=(!side&&M&&M.run)?SV.run.hp:1;
  const mult=base*rd*(side?1:masDmg(id)),hpm=base*rh*(side?1:masHp(id));
  const s=(d.sc||1)*(up?1.22:1);
  return {seed:ri(0,5),side,id,d,up,mult,x:0,y:0,hx:0,hy:0,hp:d.hp*hpm,max:d.hp*hpm,s,r:d.big?24:12*s,cd:rnd(.2,.9),acd:rnd(.8,2),haste:0,slow:0,flash:0,dead:false,t:null,retT:0,kx:0,ky:0,hits:0,fx:0,fy:side?1:-1,lunge:0,dash:null,tele:null,life:0,born:-9,stun:0};
}
function rebuild(side,c){
  const A=side?M.parmy:M.army,old=(side?M.pv1:M.pv0)||[];
  const units=[];
  const lk=k=>{const d=defOf(side,k);return LINES.indexOf(d.lin)*10+ORDER.indexOf(d.rol)+(d.ord||0)*.5;};
  const types=Object.keys(A).filter(k=>A[k].n>0).sort((a,b)=>lk(a)-lk(b));
  /* entre más gente, más chiquitos y más por fila, como en Draft; si aun así no caben, las filas se aprietan */
  let N=0;for(const id of types)N+=A[id].n;
  const f=clamp(Math.sqrt(40/Math.max(40,N)),.42,1),perMax=Math.round(10/f);
  const rowH=d=>(d.big?52:34)*f;
  let need=0;for(const id of types){const d=defOf(side,id);need+=Math.ceil(A[id].n/(d.big?3:perMax))*rowH(d);}
  const lastH=types.length?rowH(defOf(side,types[types.length-1])):34;
  const gap=Math.min(1,(side?146:160)/Math.max(1,need-lastH));
  let acc=0;
  for(const id of types){
    const n=A[id].n,d=defOf(side,id),per=d.big?3:Math.min(perMax,n);
    for(let i=0;i<n;i++){
      const u=mk(side,id,A[id].up);u.s*=f;u.r*=f;
      const r=Math.floor(i/per),col=i%per,cnt=Math.min(per,n-r*per),sp=d.big?70*f:Math.min(34*f,336/cnt);
      const hj=((i*73+id.length*31+side*17)%11)/10-.5,vj=((i*41+id.length*13)%9)/8-.5;
      u.x=u.hx=clamp(W/2+(col-(cnt-1)/2)*sp+(d.big?0:hj*sp*.55),40,380);
      const yy=(acc+r*rowH(d))*gap+(d.big?0:vj*8*f);
      u.y=u.hy=side?250-yy:530+yy;
      units.push(u);
    }
    acc+=Math.ceil(n/per)*rowH(d);
  }
  /* los que ya estaban caminan a su nuevo lugar; los nuevos llegan corriendo desde la orilla del tablero */
  const pool={};for(const u of old)(pool[u.id]=pool[u.id]||[]).push(u);
  /* entre más llegan, más seguido salen, para que nunca tarde más de ~1.6 s */
  let nNew=0;{const cnt={};for(const u of old)cnt[u.id]=(cnt[u.id]||0)+1;for(const u of units){if(cnt[u.id])cnt[u.id]--;else nNew++;}}
  const stp=Math.min(.08,1.6/Math.max(1,nNew));
  let k=0,end=T;
  for(const u of units){
    const o=pool[u.id]&&pool[u.id].shift();
    if(o){u.born=o.born;}
    else{u.x=clamp(u.hx+rnd(-25,25),40,380);u.y=side?42:H-42;u.born=T+.1+k*stp;k++;}
    if(c&&c.kind==='up'&&c.id===u.id)u.glow=T+.05*k++;
    end=Math.max(end,Math.max(u.born,T)+hyp(u.hx-u.x,u.hy-u.y)/WALK);
  }
  if(side)M.spawnEnd1=end;else M.spawnEnd0=end;
  if(side)M.pv1=units;else M.pv0=units;
}

/* ================= batalla ================= */
function startBattle(){
  CAM.z=1;CAM.x=W/2;CAM.y=H/2;
  scene='battle';
  Object.assign(M,{units:[],projs:[],fires:[],fly:[],decals:[],parts:[],texts:[],rings:[],beams:[],t:0,end:null,shake:0,hs:0,tut:null});
  for(const u of [...M.pv0,...M.pv1]){const n=mk(u.side,u.id,u.up);n.x=n.hx=u.x;n.y=n.hy=u.y;n.s=u.s;n.r=u.r;n.seed=u.seed;M.units.push(n);}
  M.jumpSaid=0;BAN=(M.boss!=null&&M.round===1)?{s:'JEFE: '+BOSSN[M.boss],t:0,dur:2,col:'#ff6a7a'}:{s:'¡LUCHA!',t:0,dur:1,col:'#fff'};sfx('fight');
}
function tutorial(key,u,text){if(SV.seen[key])return;SV.seen[key]=1;save();M.tut={u,text,t:0};sfx('tut');}
function say(u,s,col){if(M.texts.length<12)M.texts.push({x:u.x,y:u.y-u.r-28*u.s,s,col:col||'#fff',t:0,follow:u});}
function ring(x,y,r,col,dur){M.rings.push({x,y,r,col,t:0,dur:dur||.45});}
function burst(x,y,col,n,spd){for(let i=0;i<n;i++){if(M.parts.length>400)return;const a=rnd(0,6.28),s=rnd(.3,1)*spd;M.parts.push({x,y,z:rnd(4,14),vx:Math.cos(a)*s,vy:Math.sin(a)*s,vz:rnd(80,200),t:0,life:rnd(.3,.6),col,sz:rnd(2,3.5)});}}
const foes=u=>M.units.filter(o=>!o.dead&&o.side!==u.side);
const allies=u=>M.units.filter(o=>!o.dead&&o.side===u.side&&o!==u);
function nearest(u,l){let b=null,bd=1e9;for(const o of l){const d=hyp(o.x-u.x,o.y-u.y);if(d<bd){bd=d;b=o;}}return b;}
function pickT(u){
  const es=foes(u);if(!es.length)return null;
  if(u.d.snipe){const bk=es.filter(o=>o.d.lin==='Retaguardia');const l=bk.length?bk:es.filter(o=>o.d.lin==='Línea media');if(l.length)return nearest(u,l);}
  if(u.d.flank){const bk=es.filter(o=>o.d.lin==='Retaguardia'||o.d.lin==='Línea media');if(bk.length)return nearest(u,bk);}
  if(u.side===1){const bl=es.filter(o=>(o.d.taunt||o.id==='barricada')&&hyp(o.x-u.x,o.y-u.y)<150);if(bl.length)return nearest(u,bl);}
  return nearest(u,es);
}
function moveTo(u,x,y,dt){const sp=u.d.spd*(u.haste>0?1.5:1)*(u.slow>0?.5:1);const dx=x-u.x,dy=y-u.y,d=hyp(dx,dy);if(d<2)return;const s=Math.min(d,sp*dt);u.x+=dx/d*s;u.y+=dy/d*s;u.fx=dx/d;u.fy=dy/d;}
function frontY(u){let f=null;for(const o of M.units)if(!o.dead&&o.side===u.side&&(o.d.rol==='Frente'||o.d.rol==='Enjambre')&&o.id!=='barricada'){if(f===null||(u.side?o.y>f:o.y<f))f=o.y;}return f;}
function damage(t,dmg,src,kind){
  if(t.dead)return;
  if(t.d.shield&&kind==='melee'&&src&&!(src.d&&src.d.breaker)){const dx=src.x-t.x,dy=src.y-t.y,dd=hyp(dx,dy)||1;if((dx*t.fx+dy*t.fy)/dd>.2){dmg*=.5;if(Math.random()<.1)sfx('block');tutorial('p_anti',t,PO.anti.tut);}}
  t.hp-=dmg;t.flash=.12;t.hitT=.16;t.lastK=kind;goreHit(t,dmg,kind);
  if(src&&!t.d.stat&&t.id!=='tanqueta'&&kind!=='shove'&&kind!=='charge'){const dx=t.x-src.x,dy=t.y-src.y,dd=hyp(dx,dy)||1;t.kx+=dx/dd*38;t.ky+=dy/dd*38;}
  if(t.hp<=0)ko(t);
}
function ko(t){
  t.dead=true;
  if(t.id==='barricada'){burst(t.x,t.y,'#b07a4a',14,140);debris(t.x*PK,t.y*PK,1);sfx('ko');return;}
  debris(t.x*PK,t.y*PK,t.lastK==='boom');
  if(!goreKo(t)){const big=t.lastK==='boom'||t.lastK==='charge'||t.lastK==='shove',sg=Math.random()<.5?1:-1;
    M.fly.push(big?{x:t.x,y:t.y,z:4,vx:rnd(-50,50),vy:(t.side?-1:1)*rnd(60,120),vz:rnd(130,220),rot:0,vr:rnd(-9,9),side:t.side,id:t.id,s:t.s,up:t.up,seed:t.seed,t:0,big:1,sg}
      :{x:t.x,y:t.y,z:3,vx:rnd(-14,14)+(t.kx||0)*.5,vy:(t.side?-1:1)*rnd(10,26)+(t.ky||0)*.5,vz:rnd(70,105),rot:0,vr:0,side:t.side,id:t.id,s:t.s,up:t.up,seed:t.seed,t:0,sg});}
  burst(t.x,t.y,t.side?'#9fb8e0':'#ff9db8',7,110);
  M.shake=Math.max(M.shake,t.d.big?10:2);if(t.d.big)M.hs=.18;
  if(t.side){M.kos++;sfx('ko');
    for(const m of M.units){
      if(m.dead||m.side||!m.d.convert||t.d.big)continue;
      if(hyp(m.x-t.x,m.y-t.y)<200&&m.acd<=0&&Math.random()<.5){
        m.acd=5;const u=mk(0,'chela',false);Object.assign(u,{x:t.x,y:t.y,hx:t.x,hy:560,hp:CH.chela.hp*.6*m.mult,max:CH.chela.hp*.6*m.mult});
        M.units.push(u);say(m,'¡Únete!','#c78bff');ring(t.x,t.y,36,'#c78bff');sfx('join');M.beams.push({a:m,b:u,t:0,col:'#c78bff'});tutorial('c_megafono',m,CH.megafono.tut);break;
      }
    }
  }else sfx('fall');
}
function stepU(u,dt){
  u.flash-=dt;u.hitT-=dt;u.haste-=dt;u.slow-=dt;u.acd-=dt;u.retT-=dt;u.lunge-=dt;
  u.cd-=dt*(u.haste>0?2:1)*(u.slow>0?.7:1);
  u.x+=u.kx*dt;u.y+=u.ky*dt;const kd=Math.max(0,1-6*dt);u.kx*=kd;u.ky*=kd;
  const d=u.d;
  if(u.stun>0){u.stun-=dt;return;}
  /* Salto: al empezar aparecen detrás de la última fila enemiga */
  if(d.jump&&!u.jumped&&M.t>.4){
    u.jumped=true;const es=foes(u).filter(o=>o.id!=='barricada');
    if(es.length){
      let bk=es[0];for(const o of es)if(u.side?o.y>bk.y:o.y<bk.y)bk=o;
      ring(u.x,u.y,26,'#4cc9f0',.4);burst(u.x,u.y,'#4cc9f0',6,90);

function handSpr(id,o,fr,facing,act,up){
  const H=HAND[id],G=H[facing?'front':'back'],pal=handPal(id,o);
  return mkSprite(16,32,P=>{
    let BY=0;const grid=(rows,x0,y0)=>{rows.forEach((row,j)=>{for(let i=0;i<row.length;i++){const c=row[i];if(c!=='.'&&pal[c])P(x0+i,y0+j+BY,1,1,pal[c]);}});};
    const WF=[[0,0,1],[-1,1,0],[-2,1,0],[0,0,1],[1,-1,0],[1,-2,0]][fr%6],arm=[0,1,2,0,-1,-2][fr%6];
    const bob=act?(act==='wind'?1:0):WF[2];
    /* piernas: la que sube se acorta, el zapato siempre abajo de la pierna */
    for(const[x0,lf]of[[4,WF[0]],[9,WF[1]]]){const len=8-Math.abs(lf);grid(H.legs.slice(0,len),x0,22);grid(H.shoe,x0,22+len);}
    BY=bob;
    grid(G,0,0);
    /* brazos */
    const ls=Math.max(0,-arm)>1?1:Math.max(0,-arm),rs=Math.max(0,arm)>1?1:Math.max(0,arm);
    grid(H.arm,0,11+ls);
    if(act==='atk'||act==='thr')grid(H.armUp,14,2);
    else if(act==='wind')grid(H.armUp.slice(3),14,7);
    else grid(H.armR,14,11+rs);
    if(up&&H.up)grid(H.up,0,id==='anti'?-1:1);
  },up);
}

function artLoad(src,cb){const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width+4;c.height=im.height+4;c.getContext('2d').drawImage(im,2,3);cb(c);};im.src=src;}

for(const id in ARTF){const f=ARTF[id],o={walk:[]};let n=0;const tot=f.walk.length+5;
  const done=()=>{if(++n===tot){ARTFB[id]=o;}};
  f.walk.forEach((u,i)=>artLoad(u,c=>{o.walk[i]=artWrap(c);done();}));
  for(const k of ['atk','thr','wind','rec','hit'])artLoad(f[k]||f.rec,c=>{o[k]=artWrap(c);done();});}

  return{walk:W.map(a=>artFrame(b,a[0],a[1],a[2],a[3])),atk:X.atk||artFrame(b,0,3,0,0),thr:X.atk||artFrame(b,0,2,0,0),wind:artFrame(b,-1,-2,0,0),rec:artFrame(b,1,0,0,0),hit:artFrame(b,1,-4,0,0)};
}

  nightBG(r.win?'rgba(60,140,255,.18)':'rgba(214,74,90,.18)');
  TXO(r.win?'¡VICTORIA!':'DERROTA',W/2,190,48,r.win?'#b8ff6a':'#ff8aa6');
  TXO((r.dt>0?'+':'')+Math.round(r.dt*k)+' 🏆',W/2,240,24,'#fff');
  TX('Total: '+SV.tro+' · '+arena()[1],W/2,264,13,'rgba(255,255,255,.85)','center',700);
  if(r.run)TX('Marcha: '+r.run.cleared+' de '+r.run.total+' nodos',W/2,284,13,'#ffd23f','center',800);
  r.rw.forEach((q,i)=>{
    const x=24+i*96,y=300,up=q.l>q.l0&&k>=1;
    miniCard(q.id,x,y,88,112,false);
    RR(x+82,y+6,8,100,4,'#37324a');const p=q.l>=15?1:(q.c/need(q.l))*k;RR(x+82,y+106-100*p,8,100*p,4,'#7fe0ff');
    TXO('+'+q.add,x+44,y+134,15,'#fff');
    if(up)TXO('¡SUBE A NV '+q.l+'!',x+44,y+156,11,'#ffd23f');
    TXO('+'+q.mg+' ★',x+44,y+180,14,'#7fc0ff');
    if(q.m1>q.m0&&k>=1){TXO('¡Maestría '+q.m1+'!',x+44,y+200,11,'#7fc0ff');TX(MASR[q.m1-1][1],x+44,y+216,10,'#fff','center',800);}
  });
  let y=540;
  if(r.unl.length&&k>=1){TXO('¡Nuevo personaje: '+r.unl.map(id=>CH[id].n).join(', ')+'!',W/2,y,16,'#ffd23f');TX('Agrégalo a tu mazo en Colección',W/2,y+20,12,'#fff','center',700);y+=50;}
  if(r.newArena&&k>=1){TXO('Nueva arena: '+r.newArena,W/2,y,17,'#fff');}
  if(r.bossWin&&k>=1)TXT('¡JEFE DERROTADO!',W/2,y+(r.newArena?34:0),22,'#ff6a7a');
  if(r.capped&&k>=1)TXT('¡El jefe de la zona te espera!',W/2,y,18,'#ff6a7a');
  if(r.bossLose&&k>=1)TX('El jefe sigue ahí. Mejora tu mazo e inténtalo de nuevo.',W/2,y,13,'#fff','center',700);
  btn(90,640,240,60,'CONTINUAR','#4fbf3a',()=>{scene=r.ending?'ending':'home';},22);
}

/* ================= bucle ================= */
let last=0;
function frame(ts){
  const raw=Math.min(.05,(ts-last)/1000||0);last=ts;T+=raw;
  if(confirmReset>0)confirmReset-=raw;
  if(scene==='draft'&&M.guide==null){
    for(const u of [...(M.pv0||[]),...(M.pv1||[])]){u.mv=false;if(T<u.born)continue;const dx=u.hx-u.x,dy=u.hy-u.y,d=hyp(dx,dy);if(d>.5){const st=Math.min(d,WALK*raw);u.x+=dx/d*st;u.y+=dy/d*st;u.mv=true;u.fx=dx/d;u.fy=dy/d;}}
    if(M.pqT>0){
      M.pqT-=raw;
      if(M.pqT<=0){
        if(M.enemyTurn&&M.pq.length){const c=M.pq.shift();applyCard(1,c);M.enemyBan={c,t:T};sfx('enemy');M.enemyTurn=false;M.pqT=Math.max(1.1,(M.spawnEnd1||T)-T+.4);}
        else{M.pqT=0;M.enemyTurn=false;if(M.bonusOpts){M.opts=M.bonusOpts;M.bonusOpts=null;M.bonusPick=true;sfx('up');}else if(M.pickN>=PICKS){M.nextT=.3;}else nextOpts();}
      }
    }
    if(M.nextT>0){M.nextT-=raw;if(M.nextT<=0){M.nextT=0;
      if(M.bonusJust){M.bonusJust=false;nextOpts();}
      else if(M.pq.length){M.enemyTurn=true;M.pqT=.45;}
      else if(M.pickN>=PICKS)startBattle();else nextOpts();}}
  }
  if(scene==='battle'){
    if(M.tut)M.tut.t+=raw;
    else if(M.hs>0)M.hs-=raw;
    else{const sl=M.slowT>0?.3:1;M.slowT=(M.slowT||0)-raw;for(let i=0;i<M.speed;i++)battleStep(raw*(M.end?.35:1)*sl);}
    M.shake=Math.max(0,M.shake-raw*18);
    if(M.end&&!M.tut){M.end.t+=raw;if(M.end.t>2.2)afterRound();}
  }
  if(scene==='end')ENDA+=raw;
  if(BAN&&!(M&&M.tut)){BAN.t+=raw;if(BAN.t>BAN.dur)BAN=null;}
  audioTick();
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0f0d13';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*sc,0,0,dpr*sc,dpr*ox,dpr*oy);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  btns=[];
  if(scene==='ending')drawEnding();else if(scene==='map')drawMap();else if(scene==='opts')drawOpts();else if(scene==='title')drawTitle();else if(scene==='home')drawHome();else if(scene==='perfil')drawPerfil();else if(scene==='col')drawCol();else if(scene==='info')drawInfo();else if(scene==='draft')drawDraft();else if(scene==='battle')drawBattle();else if(scene==='end')drawEnd();
  if(BAN&&!(M&&M.tut)&&(scene==='battle'||scene==='draft')){
    const b=BAN,a=b.t<.12?b.t/.12:b.t>b.dur-.3?(b.dur-b.t)/.3:1,s=1+(b.t<.12?(1-b.t/.12)*.5:0);
    ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.translate(W/2,H/2);ctx.scale(s,s);ctx.font='900 40px '+FONT;const bs=Math.min(40,Math.floor(40*(W-50)/Math.max(1,ctx.measureText(b.s).width)));TXO(b.s,0,10,bs,b.col);ctx.restore();
  }
  ctx.restore();
  requestAnimationFrame(frame);
}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);sc=Math.min(innerWidth/W,innerHeight/H);ox=(innerWidth-W*sc)/2;oy=(innerHeight-H*sc)/2;}
const toLocal=e=>({x:(e.clientX-ox)/sc,y:(e.clientY-oy)/sc});
addEventListener('resize',resize);
cv.addEventListener('pointermove',e=>{ptr=toLocal(e);});
cv.addEventListener('pointerdown',e=>{
  audioInit();if(AU.on&&AU.a.state==='suspended')AU.a.resume();
  ptr=toLocal(e);
  for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(ptr.x>=b.x&&ptr.x<=b.x+b.w&&ptr.y>=b.y&&ptr.y<=b.y+b.h){sfx('tap');b.fn();return;}}
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,()=>{if(M)M.peek=false;}));
addEventListener('keydown',e=>{
  if(scene==='draft'&&/^Digit[1-3]$/.test(e.code)){SV.seen.cards=1;pickCard(+e.code.slice(5)-1);}
  if(scene==='battle'&&M.tut&&(e.code==='Space'||e.code==='Enter')&&M.tut.t>.5){M.tut=null;e.preventDefault();return;}
  if(scene==='battle'&&e.code==='Space'){M.speed=M.speed===1?2:1;e.preventDefault();}
});
resize();
//@@API@@
requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>
